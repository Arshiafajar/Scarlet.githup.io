<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#6b4a63;--paper:#fff8fb;--sky1:#cfe6ff;--sky2:#ffe3f0;--sky3:#fff2d9}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--ink);background:linear-gradient(#b9dcff 0,#f6d9ff 260px,#ffe9d6 420px);overflow-x:hidden}
#garden{position:relative;width:100%;overflow:hidden}
.sun{position:absolute;top:26px;right:7%;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b8,#ffd75e);box-shadow:0 0 0 14px #ffe8908a,0 0 0 30px #ffe8903d;animation:pulse 6s ease-in-out infinite}
.sun::before{content:"";position:absolute;left:25px;top:36px;width:7px;height:7px;border-radius:50%;background:#a0612c;box-shadow:26px 0 #a0612c}
.sun::after{content:"";position:absolute;left:33px;top:48px;width:18px;height:9px;border-bottom:3px solid #a0612c;border-radius:0 0 18px 18px}
@keyframes pulse{50%{transform:scale(1.05)}}
.cloud{position:absolute;top:44px;width:170px;height:54px;background:#fff;border-radius:60px;opacity:.95;animation:drift 40s linear infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:70px;height:70px;left:24px;top:-34px}
.cloud::after{width:52px;height:52px;left:84px;top:-22px}
@keyframes drift{to{transform:translateX(60px)}}
.hill{position:absolute;border-radius:50%}
.ground{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#b8e69b,#8fd18b 60%,#7cc383)}
.fly{position:absolute;font-size:22px;pointer-events:none;animation:flit 14s ease-in-out infinite}
@keyframes flit{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(60px,-40px) rotate(10deg)}50%{transform:translate(130px,10px) rotate(-6deg)}75%{transform:translate(50px,40px) rotate(8deg)}100%{transform:translate(0,0) rotate(-8deg)}}
.it{position:absolute;background:none;border:0;padding:0;cursor:pointer;transform:translate(-50%,-100%);-webkit-tap-highlight-color:transparent}
.it svg{display:block;width:100%;height:auto;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite;filter:drop-shadow(0 3px 2px #3a7a4a33)}
.it .pop{display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1);animation:grow .9s cubic-bezier(.3,1.5,.5,1) both}
.it:hover .pop,.it:focus-visible .pop{transform:scale(1.14) translateY(-4px)}
.it:focus-visible{outline:3px dashed #ff8fb5;outline-offset:4px;border-radius:12px}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes grow{from{transform:scale(0)}}
.petal svg{animation:wob 5s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-4deg) translateY(1px)}}
.drop{position:absolute;top:96px;background:none;border:0;cursor:pointer;padding:10px 8px;animation:fall linear infinite;transform:translateX(-50%)}
.drop svg{display:block;width:100%;height:auto}
.drop:hover,.drop:focus-visible{animation-play-state:paused}
.drop:hover svg{transform:scale(1.25)}
.drop svg{transition:transform .2s}
@keyframes fall{0%{transform:translate(-50%,0);opacity:0}12%{opacity:1}80%{opacity:1}100%{transform:translate(-50%,var(--fall));opacity:0}}
#empty{position:absolute;left:0;right:0;text-align:center;font-family:Caveat,cursive;font-size:30px;color:#fff;text-shadow:0 2px 0 #5aa66a}
#legend{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:8px 16px;background:#fffafce0;border:2px solid #ffd3e5;border-radius:999px;font-size:13px;font-weight:800;backdrop-filter:blur(6px);z-index:9999}
#legend span{white-space:nowrap}
.veil{position:fixed;inset:0;background:#5b3a5a55;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10000}
.veil.on{display:flex}
.card{position:relative;width:min(460px,100%);max-height:86vh;overflow:auto;background:var(--paper);border:4px solid var(--c,#ffb3d1);border-radius:30px;padding:26px 26px 22px;box-shadow:0 10px 0 var(--c,#ffb3d1),0 24px 50px #5b3a5a40;animation:up .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes up{from{transform:translateY(24px) scale(.92);opacity:0}}
.card .big{font-size:44px;line-height:1}
.card .lab{font-weight:800;font-size:15px;margin-top:6px;color:var(--ink)}
.card .dt{font-size:13px;opacity:.65;font-weight:600}
.card h2{font-size:22px;margin:14px 0 4px}
.card .story{font-family:Caveat,cursive;font-size:25px;line-height:1.3;white-space:pre-wrap;margin-top:10px;word-break:break-word}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;border:0;background:#ffe3ef;color:var(--ink);font-size:18px;cursor:pointer;font-weight:800}
button.pill{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 18px;background:var(--c,#ff9ec7);color:#fff;cursor:pointer;text-shadow:0 1px 0 #0002}
button.pill.soft{background:#ffe3ef;color:var(--ink);text-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp{font:inherit;font-weight:800;font-size:14px;border:3px solid #f6d6e4;background:#fff;border-radius:18px;padding:10px 6px;cursor:pointer;color:var(--ink)}
.tp.sel{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 22%,white)}
input,textarea{width:100%;font:inherit;font-weight:600;color:var(--ink);background:#fff;border:3px solid #f6d6e4;border-radius:16px;padding:10px 12px;margin-top:8px}
textarea{min-height:170px;resize:vertical;font-family:Caveat,cursive;font-size:23px;line-height:1.25}
input:focus,textarea:focus{outline:none;border-color:#ff9ec7}
details{margin-top:14px;font-size:14px;font-weight:600}
summary{cursor:pointer;font-weight:800}
small{display:block;opacity:.7;margin-top:6px;line-height:1.4}
#wbtn{position:fixed;right:16px;bottom:16px;z-index:9998;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#ff9ec7;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 16px #b0507a55;display:none}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:#fff;border:3px solid #ffd3e5;border-radius:999px;padding:9px 18px;font-weight:800;z-index:10001;transition:transform .35s;max-width:92vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
@media(max-width:600px){#legend{font-size:12px;gap:4px 10px;padding:7px 12px;bottom:8px}.sun{width:62px;height:62px;top:20px}.sun::before{left:18px;top:26px;box-shadow:19px 0 #a0612c}.sun::after{left:24px;top:36px;width:13px;height:7px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="garden">
  <div class="sun"></div>
  <div class="cloud" style="left:6%"></div>
  <div class="cloud" style="left:44%;top:70px;transform:scale(.8);animation-duration:55s"></div>
  <div class="hill" id="h1" style="background:#c6ecb0"></div>
  <div class="hill" id="h2" style="background:#aee39c"></div>
  <div class="ground" id="ground"></div>
  <div class="fly" style="left:12%;top:190px">🦋</div>
  <div class="fly" style="left:68%;top:150px;animation-delay:-6s">🐝</div>
  <div id="layer"></div>
  <div id="empty" style="display:none">the garden is waiting 🌱</div>
</div>

<div id="legend">
  <span>🌸 something good</span><span>🥀 something lost</span><span>🌵 something hurt</span><span>💧 a day I cried</span>
</div>

<div class="veil" id="rv"><div class="card" id="rc"></div></div>

<button id="wbtn" aria-label="write">✎</button>
<div class="veil" id="wv"><div class="card" id="wc" style="--c:#ff9ec7">
  <button class="x" id="wx" aria-label="close">✕</button>
  <div class="lab" style="font-size:20px;margin-bottom:10px">plant something</div>
  <div class="types" id="types"></div>
  <input id="wdate" type="date">
  <input id="wtitle" placeholder="title (optional)">
  <textarea id="wstory" placeholder="what happened…"></textarea>
  <div class="row"><button class="pill" id="plant">plant it 🌱</button><button class="pill soft" id="wcancel">cancel</button></div>
  <details><summary>publishing settings</summary>
    <input id="srepo" placeholder="repo, e.g. yourname/yourname.github.io">
    <input id="sbranch" placeholder="branch (default: main)">
    <input id="stoken" type="password" placeholder="GitHub token (Contents: read & write)">
    <small>Stored only in this browser. Without a token, entries stay on this device; use “copy garden.json” and commit it manually.</small>
    <div class="row"><button class="pill soft" id="ssave">save settings</button><button class="pill soft" id="scopy">copy garden.json</button></div>
  </details>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const T={
 flower:{e:'🌸',l:'something good happened',c:'#ff9ec7'},
 petal:{e:'🥀',l:'something I lost',c:'#c9a7ff'},
 cactus:{e:'🌵',l:'something that hurt',c:'#7ccf8a'},
 rain:{e:'💧',l:'I cried today',c:'#8ecbff'}
};
const PAL=['#ff9ec7','#ffb27a','#ffd95e','#c9a7ff','#ff8fa3','#8fd0ff','#ffffff','#ffc4e1'];
const jp=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let entries=[],D=jp('g_d',[]),S=jp('g_s',{}),sel='flower';
const writeMode=()=>location.hash.includes('write');

const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const pick=(id,a)=>a[hash(id)%a.length];

const flowerSVG=c=>{let p='';for(let i=0;i<7;i++)p+=`<ellipse cx="40" cy="22" rx="9" ry="15" fill="${c}" transform="rotate(${i*360/7} 40 40)"/>`;
return `<svg viewBox="0 0 80 130"><path d="M40 125C38 100 42 80 40 48" stroke="#6fbf6a" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M40 100C25 100 18 88 16 82C30 82 38 90 40 100Z" fill="#8bd47f"/><path d="M40 86C55 86 62 74 64 68C50 68 42 76 40 86Z" fill="#8bd47f"/>${p}<circle cx="40" cy="40" r="11" fill="#ffe27a"/><circle cx="36" cy="38" r="1.7" fill="#7a4b2a"/><circle cx="44" cy="38" r="1.7" fill="#7a4b2a"/><path d="M36.5 43Q40 46 43.5 43" stroke="#7a4b2a" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`};
const cactusSVG=()=>`<svg viewBox="0 0 80 100"><rect x="27" y="24" width="26" height="70" rx="13" fill="#7ccf8a"/><rect x="8" y="46" width="30" height="13" rx="6.5" fill="#7ccf8a"/><rect x="8" y="30" width="13" height="29" rx="6.5" fill="#7ccf8a"/><rect x="42" y="38" width="30" height="13" rx="6.5" fill="#7ccf8a"/><rect x="59" y="24" width="13" height="27" rx="6.5" fill="#7ccf8a"/><g stroke="#3f8f55" stroke-width="2" stroke-linecap="round"><path d="M30 34l-4-2M30 66l-4 2M50 30l4-2M50 70l4 2M12 36l-3-2M68 30l3-2M24 48l-3 0"/></g><circle cx="35" cy="54" r="2" fill="#3d2b3a"/><circle cx="45" cy="54" r="2" fill="#3d2b3a"/><path d="M37 60Q40 63 43 60" stroke="#3d2b3a" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="31" cy="60" r="3" fill="#ff9ec7" opacity=".7"/><circle cx="49" cy="60" r="3" fill="#ff9ec7" opacity=".7"/><circle cx="40" cy="22" r="6" fill="#ff8fb5"/><circle cx="35" cy="26" r="4.5" fill="#ffb3cf"/><circle cx="45" cy="26" r="4.5" fill="#ffb3cf"/><circle cx="40" cy="23" r="2.6" fill="#ffe27a"/></svg>`;
const petalSVG=c=>`<svg viewBox="0 0 64 34"><path d="M4 22C4 6 26 2 34 13C30 27 12 31 4 22Z" fill="${c}"/><path d="M8 20C14 14 22 11 29 12" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M38 28C38 17 52 14 58 21C54 31 43 33 38 28Z" fill="${c}" opacity=".85"/></svg>`;
const dropSVG=()=>`<svg viewBox="0 0 30 40"><path d="M15 2C15 2 3 18 3 26a12 12 0 0 0 24 0C27 18 15 2 15 2Z" fill="#8ecbff" stroke="#5aa8ee" stroke-width="1.5"/><ellipse cx="10" cy="24" rx="2.5" ry="5" fill="#fff" opacity=".7" transform="rotate(12 10 24)"/><circle cx="12" cy="29" r="1.2" fill="#3d5a80"/><circle cx="19" cy="29" r="1.2" fill="#3d5a80"/></svg>`;

function layout(){
  const W=innerWidth, G=300;
  const ground=entries.filter(e=>e.type!=='rain');
  const H=Math.max(innerHeight,560+Math.ceil(ground.length/(W<600?4:8))*130);
  const g=$('#garden');g.style.height=H+'px';
  $('#ground').style.top=G+'px';
  Object.assign($('#h1').style,{left:'-12%',top:(G-50)+'px',width:'70%',height:'180px'});
  Object.assign($('#h2').style,{left:'48%',top:(G-34)+'px',width:'70%',height:'160px'});
  return {G,H,W};
}
function render(){
  const all=writeMode()?[...entries,...D.filter(d=>!entries.some(e=>e.id===d.id))]:entries;
  const list=[...all].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id.localeCompare(b.id));
  const saved=entries;entries=list;const {G,H,W}=layout();entries=saved;
  const L=$('#layer');L.innerHTML='';
  $('#empty').style.display=list.length?'none':'block';$('#empty').style.top=(G+90)+'px';
  let gi=0,ri=0;
  list.forEach(e=>{
    const b=document.createElement('button');
    b.setAttribute('aria-label',(T[e.type]||T.flower).l+(e.title?': '+e.title:''));
    b.onclick=()=>openEntry(e);
    if(e.type==='rain'){
      const x=((ri*0.6180339+.11)%1)*(W-70)+35;ri++;
      b.className='drop';b.style.left=x+'px';b.style.width='38px';
      b.style.setProperty('--fall',(G-20+((hash(e.id)%60)))+'px');
      b.style.animationDuration=(8+hash(e.id)%6)+'s';b.style.animationDelay=-(hash(e.id+'d')%100)/10+'s';
      b.innerHTML=dropSVG();
    }else{
      const x=((gi*0.6180339+.13)%1)*88+6;
      const y=G+70+((gi*0.381966+.07)%1)*(H-G-110);gi++;
      const s=.72+.5*((y-G)/(H-G));
      const w={flower:70,cactus:66,petal:62}[e.type]||70;
      b.className='it '+(e.type==='petal'?'petal':'');
      b.style.left=x+'%';b.style.top=y+'px';b.style.width=(w*s)+'px';b.style.zIndex=Math.round(y);
      const svg=e.type==='cactus'?cactusSVG():e.type==='petal'?petalSVG(pick(e.id,PAL.filter(c=>c!=='#ffffff'))):flowerSVG(pick(e.id,PAL));
      b.innerHTML=`<span class="pop">${svg}</span>`;
      b.firstChild.style.animationDelay=(hash(e.id)%400)/1000+'s';
      b.querySelector('svg').style.animationDelay=-(hash(e.id)%45)/10+'s';
    }
    L.appendChild(b);
  });
}

function openEntry(e){
  const t=T[e.type]||T.flower,c=$('#rc');c.style.setProperty('--c',t.c);
  c.innerHTML='<button class="x" aria-label="close">✕</button><div class="big"></div><div class="lab"></div><div class="dt"></div><h2></h2><div class="story"></div>';
  c.querySelector('.big').textContent=t.e;c.querySelector('.lab').textContent=t.l;
  c.querySelector('.dt').textContent=e.date?new Date(e.date+'T12:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}):'';
  const h=c.querySelector('h2');e.title?h.textContent=e.title:h.remove();
  c.querySelector('.story').textContent=e.story||'';
  c.querySelector('.x').onclick=closeR;
  if(writeMode()){const r=document.createElement('div');r.className='row';r.innerHTML='<button class="pill soft">pull it out</button>';r.firstChild.onclick=()=>del(e);c.appendChild(r)}
  $('#rv').classList.add('on');
}
const closeR=()=>$('#rv').classList.remove('on');
$('#rv').onclick=e=>{if(e.target.id==='rv')closeR()};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeR();$('#wv').classList.remove('on')}});

const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3800)};

/* ---------- GitHub publishing ---------- */
const enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(r)};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
async function publish(fn,msg){
  const h={Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json'};
  const u=`https://api.github.com/repos/${S.repo}/contents/garden.json`,br=S.branch||'main';
  let sha,data=[];
  const r=await fetch(u+'?ref='+br,{headers:h,cache:'no-store'});
  if(r.ok){const j=await r.json();sha=j.sha;data=JSON.parse(dec(j.content))}else if(r.status!==404)throw new Error('GitHub '+r.status);
  data=fn(data);
  const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:enc(JSON.stringify(data,null,2)),sha,branch:br})});
  if(!p.ok)throw new Error('GitHub '+p.status);
  return data;
}
const canPub=()=>S.token&&S.repo;
const saveD=()=>localStorage.setItem('g_d',JSON.stringify(D));

async function plant(){
  const story=$('#wstory').value.trim(),title=$('#wtitle').value.trim();
  if(!story&&!title){toast('write something first');return}
  const e={id:Date.now().toString(36),type:sel,title,date:$('#wdate').value,story};
  D.push(e);saveD();
  $('#plant').disabled=true;
  try{
    if(canPub()){entries=await publish(d=>[...d,...D.filter(x=>!d.some(y=>y.id===x.id))],'new entry');D=[];saveD();toast('planted 🌱 live in about a minute')}
    else toast('planted on this device only — add a token to publish');
  }catch(err){toast('kept on this device — '+err.message)}
  $('#plant').disabled=false;
  $('#wstory').value='';$('#wtitle').value='';$('#wv').classList.remove('on');render();
}
async function del(e){
  if(!confirm('pull this out of the garden?'))return;
  try{
    if(D.some(d=>d.id===e.id)){D=D.filter(d=>d.id!==e.id);saveD()}
    if(canPub()&&entries.some(x=>x.id===e.id))entries=await publish(d=>d.filter(x=>x.id!==e.id),'remove entry');
    else entries=entries.filter(x=>x.id!==e.id);
    toast('removed');
  }catch(err){toast(err.message)}
  closeR();render();
}

/* ---------- write panel ---------- */
$('#types').innerHTML=Object.entries(T).map(([k,t])=>`<button class="tp" data-t="${k}" style="--tc:${t.c}">${t.e} ${t.l}</button>`).join('');
function selType(k){sel=k;document.querySelectorAll('.tp').forEach(b=>b.classList.toggle('sel',b.dataset.t===k));$('#wc').style.setProperty('--c',T[k].c)}
document.querySelectorAll('.tp').forEach(b=>b.onclick=()=>selType(b.dataset.t));selType('flower');
$('#wbtn').onclick=()=>{$('#wdate').value=new Date().toISOString().slice(0,10);$('#srepo').value=S.repo||'';$('#sbranch').value=S.branch||'';$('#stoken').value=S.token||'';$('#wv').classList.add('on');$('#wstory').focus()};
const closeW=()=>$('#wv').classList.remove('on');
$('#wx').onclick=closeW;$('#wcancel').onclick=closeW;$('#plant').onclick=plant;
$('#ssave').onclick=()=>{S={repo:$('#srepo').value.trim().replace(/^https?:\/\/github\.com\//,''),branch:$('#sbranch').value.trim(),token:$('#stoken').value.trim()};localStorage.setItem('g_s',JSON.stringify(S));toast('settings saved')};
$('#scopy').onclick=async()=>{const all=[...entries,...D.filter(d=>!entries.some(e=>e.id===d.id))];try{await navigator.clipboard.writeText(JSON.stringify(all,null,2));toast('copied garden.json')}catch(e){toast('copy failed')}};

function syncMode(){$('#wbtn').style.display=writeMode()?'block':'none';render()}
addEventListener('hashchange',syncMode);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});

(async()=>{
  try{const r=await fetch('garden.json?t='+Date.now(),{cache:'no-store'});entries=await r.json()}catch(e){entries=[]}
  syncMode();
})();
</script>
</body>
</html>
